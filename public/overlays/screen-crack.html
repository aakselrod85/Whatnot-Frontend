<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screen Crack</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body.preview { background: #0d1a12 linear-gradient(160deg, #1d3b26 0%, #0d1a12 60%, #08100b 100%); }
  canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  #hud { position: fixed; left: 12px; bottom: 12px; font: 13px/1.5 system-ui, sans-serif; color: #cfe3d6;
         background: rgba(0,0,0,.45); padding: 8px 12px; border-radius: 8px; display: none; }
  body.preview #hud { display: block; }
  #hud b { color: #fff; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="hud"><b>Space</b> / <b>N</b> new crack → shatter · <b>C</b> crack · <b>S</b> shatter · <b>R</b> reset · click = crack at cursor<br><span id="seed">—</span></div>
<script>
/*
  Procedural cracked screen + shatter, 1080x1920, transparent. Every trigger generates a new crack.

  Stage 1  crack():   flash at the hit point, cracks race out to a moderate radius, the glass shakes, then holds.
  Stage 2  shatter(): a second jolt: the crack runs to the screen edges in 0.2 s while the glass shakes, and every
                      piece bursts off the moment the crack front reaches it, then tumbles out of the bottom. Stage 2 starts from exactly the held frame (same object in memory).

  JS API (window.ScreenCrack):
    crack({x, y, seed})   start stage 1; x/y default to the ball strike point (643, 851) with ±70 px jitter
    shatter()             start stage 2 from the held crack
    play({x, y, seed, hold})  crack, hold `hold` ms (default 1200), then shatter
    reset()               clear everything
  Events: window 'screencrack' CustomEvent, detail.phase = 'crack' | 'hold' | 'shatter' | 'done'

  Default: transparent, no UI, ONE pass (crack → hold → shatter) on load, then empty — for an OBS Browser Source.
  URL params: ?preview=1 (background, help bar, keys/click), ?demo=1 (loop), ?x=&y= (hit point),
              ?jitter=70, ?hold=1200, ?seed=123 (fixed crack), ?freeze=1:0.1 | 2:0.5 | hold (render one frame, for tests)
*/
(() => {
  const W = 1080, H = 1920, FAR = 2600;
  const RUN = 0.14;   // stage 2: seconds for the second crack to run to the edges; pieces break off as it passes
  const P = new URLSearchParams(location.search);
  const num = (k, d) => (P.has(k) && P.get(k) !== '' && isFinite(+P.get(k))) ? +P.get(k) : d;
  const CFG = { x: num('x', 643), y: num('y', 851), jitter: num('jitter', 70), hold: num('hold', 1200) };
  const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
  // Default (OBS): fully transparent, no UI, plays ONE random crack → hold → shatter on load, then stays empty.
  // ?preview=1 adds a background, the help bar and keyboard/click controls for testing; ?demo=1 loops.
  const PREVIEW = P.get('preview') === '1', DEMO = P.get('demo') === '1';
  if (PREVIEW) document.body.classList.add('preview');
  // fit the 1080x1920 canvas into the window (exact 1:1 inside a 1080x1920 OBS browser source)
  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    cvs.style.width = (W * s) + 'px'; cvs.style.height = (H * s) + 'px';
  }
  addEventListener('resize', fit); fit();

  // ---------- helpers ----------
  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const clamp = (u, a = 0, b = 1) => Math.max(a, Math.min(b, u));
  const easeOut = (u, p = 2) => 1 - Math.pow(1 - clamp(u), p);
  const smooth = u => { u = clamp(u); return u * u * (3 - 2 * u); };

  // Sutherland–Hodgman clip of a polygon to a rectangle
  function clipRect(pts, x0, y0, x1, y1) {
    const edges = [
      [p => p[0] >= x0, (a, b) => { const t = (x0 - a[0]) / (b[0] - a[0]); return [x0, a[1] + t * (b[1] - a[1])]; }],
      [p => p[0] <= x1, (a, b) => { const t = (x1 - a[0]) / (b[0] - a[0]); return [x1, a[1] + t * (b[1] - a[1])]; }],
      [p => p[1] >= y0, (a, b) => { const t = (y0 - a[1]) / (b[1] - a[1]); return [a[0] + t * (b[0] - a[0]), y0]; }],
      [p => p[1] <= y1, (a, b) => { const t = (y1 - a[1]) / (b[1] - a[1]); return [a[0] + t * (b[0] - a[0]), y1]; }],
    ];
    let out = pts;
    for (const [inside, cut] of edges) {
      const inp = out; out = [];
      for (let i = 0; i < inp.length; i++) {
        const a = inp[i], b = inp[(i + 1) % inp.length];
        const ia = inside(a), ib = inside(b);
        if (ia) out.push(a);
        if (ia !== ib) out.push(cut(a, b));
      }
      if (!out.length) break;
    }
    return out;
  }
  function clipHalf(pts, nx, ny, c) {          // keep the side where nx*x + ny*y <= c
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length], da = nx * a[0] + ny * a[1] - c, db = nx * b[0] + ny * b[1] - c;
      if (da <= 0) out.push(a);
      if ((da <= 0) !== (db <= 0)) { const t = da / (da - db); out.push([a[0] + t * (b[0] - a[0]), a[1] + t * (b[1] - a[1])]); }
    }
    return out;
  }
  function areaOf(pts) { let A = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; A += a[0] * b[1] - b[0] * a[1]; } return Math.abs(A) / 2; }
  function centroid(pts) {
    let A = 0, cx = 0, cy = 0;
    for (let i = 0; i < pts.length; i++) {
      const [x0, y0] = pts[i], [x1, y1] = pts[(i + 1) % pts.length], c = x0 * y1 - x1 * y0;
      A += c; cx += (x0 + x1) * c; cy += (y0 + y1) * c;
    }
    if (Math.abs(A) < 1e-6) return [pts[0][0], pts[0][1]];
    return [cx / (3 * A), cy / (3 * A)];
  }

  // ---------- generation ----------
  // A drawn, controlled look (bold white strokes): long smooth rays from the hit, several running off-screen,
  // joined by webs of mostly straight segments. Structure still varies per seed: one of three families
  // (spoke / web / lattice), uneven ray spacing and lengths with a slight lean, partial webs, a mild stretch. Stage 1 shows each crack only up to its own visible length; the full
  // partition to the screen edges is used by the stage-2 run-out and the shatter.
  const STYLES = {
    spoke:   { ray: [9, 13], rv: [460, 720], rings: [1, 2], arcP: .75, wig: [.04, .09], noise: .14, br: [0, 1], long: .45, far: [4, 6] },
    web:     { ray: [8, 11], rv: [420, 640], rings: [2, 3], arcP: .85, wig: [.04, .10], noise: .16, br: [0, 2], long: .35, far: [3, 5] },
    lattice: { ray: [7, 10], rv: [380, 580], rings: [3, 4], arcP: .9,  wig: [.05, .11], noise: .18, br: [0, 1], long: .3,  far: [3, 4] },
  };
  function polyLen(pts) { const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return cum; }
  function mkEdge(pts, d0, vis1) { const cum = polyLen(pts); const len = cum[cum.length - 1]; return { pts, cum, len, d0, vis1: Math.min(vis1, len) }; }

  function generate(seed, hx, hy) {
    const r = mulberry32(seed), U = (a, b) => a + (b - a) * r(), RI = (a, b) => a + Math.floor(r() * (b - a + 1));
    const HX = hx + U(-CFG.jitter, CFG.jitter), HY = hy + U(-CFG.jitter, CFG.jitter);
    const roll = r(), style = roll < .34 ? 'spoke' : roll < .72 ? 'web' : 'lattice', S = STYLES[style];
    const nVisRay = RI(...S.ray), RV = U(...S.rv), wig = U(...S.wig);

    // uneven angular spacing for the visible cracks
    const wts = []; for (let k = 0; k < nVisRay; k++) wts.push(Math.pow(U(.18, 1), U(.6, 1.7)));
    const wsum = wts.reduce((x, y) => x + y, 0), rot = U(0, 2 * Math.PI);
    const visAng = []; let acc = 0;
    for (let k = 0; k < nVisRay; k++) { visAng.push(rot + acc + Math.PI * wts[k] / wsum); acc += 2 * Math.PI * wts[k] / wsum; }
    // hidden rays fill big gaps so every crack shatters into enough pieces (invisible until stage 2)
    const ang = [], hidden = [], MAXGAP = .62;
    for (let k = 0; k < nVisRay; k++) {
      const a0 = visAng[k], a1 = visAng[(k + 1) % nVisRay] + (k === nVisRay - 1 ? 2 * Math.PI : 0), gap = a1 - a0;
      ang.push(a0); hidden.push(false);
      const m = Math.ceil(gap / MAXGAP) - 1;
      for (let q = 1; q <= m; q++) { ang.push(a0 + gap * (q + U(-.2, .2)) / (m + 1)); hidden.push(true); }
    }
    const nRay = ang.length, half = [];
    for (let k = 0; k < nRay; k++) { const prev = (ang[k] - ang[(k - 1 + nRay) % nRay] + 4 * Math.PI) % (2 * Math.PI), next = (ang[(k + 1) % nRay] - ang[k] + 4 * Math.PI) % (2 * Math.PI); half.push(.42 * Math.min(prev, next)); }

    // directional lean + per-ray visible length (hidden rays: 0)
    const bAng = U(0, 2 * Math.PI), bias = U(0, .35);
    const rayVis = ang.map((a, k) => hidden[k] ? 0 : RV * (1 + bias * Math.cos(a - bAng)) * U(.75, 1.25) * (r() < S.long ? U(1.6, 2.6) : 1));
    // several visible cracks run all the way off-screen
    { const vis = ang.map((_, k) => k).filter(k => !hidden[k]);
      for (let n = Math.min(vis.length, RI(...S.far)); n > 0; n--) { const i = Math.floor(r() * vis.length); rayVis[vis[i]] = FAR; vis.splice(i, 1); } }

    // rays from slightly offset origins (messy centre)
    const N = 70, rays = [], origR = [];
    for (let k = 0; k < nRay; k++) {
      const o = U(0, 5), oa = U(0, 2 * Math.PI), ox = HX + o * Math.cos(oa), oy = HY + o * Math.sin(oa);
      const pts = [[ox, oy]]; let a = ang[k], av = 0;
      for (let i = 1; i <= N; i++) {
        const rad = FAR * Math.pow(i / N, 1.6); if (rad < o + 8) continue;
        av = av * .55 + U(-1, 1) * wig * .16;                       // smooth turning, with momentum
        const na = a + av;
        if (na < ang[k] - half[k] || na > ang[k] + half[k]) av *= -.3; else a = na;
        const j = Math.min(1.2, rad * .01);
        pts.push([HX + rad * Math.cos(a) + U(-j, j), HY + rad * Math.sin(a) + U(-j, j)]);
      }
      rays.push(pts); origR.push(o + 8);
    }
    const rayPoint = (k, rad) => { const pts = rays[((k % nRay) + nRay) % nRay];
      for (let i = 1; i < pts.length; i++) if (Math.hypot(pts[i][0] - HX, pts[i][1] - HY) >= rad) return [pts[i], i];
      return [pts[pts.length - 1], pts.length - 1]; };
    const raySeg = (k, r0, r1) => { const pts = rays[((k % nRay) + nRay) % nRay];
      const [p0, i0] = rayPoint(k, r0), [p1, i1] = rayPoint(k, r1); return [p0, ...pts.slice(i0 + 1, i1), p1]; };

    // rings: visible ones (style-dependent), hidden ones for the shatter partition, then the far edge
    const nr = RI(...S.rings), fr = [];
    for (let i = 0; i < nr; i++) fr.push(U(.22, .95));
    fr.sort((x, y) => x - y);
    const base = [];
    for (const f of fr) { const R = RV * f; if (!base.length || R - base[base.length - 1] > 80) base.push(R); }
    const nVis = base.length;
    for (const m of [U(1.5, 1.9), U(2.7, 3.3), U(4.5, 5.5)]) { const R = RV * m; if (R < FAR - 300 && R - (base[base.length - 1] || 0) > 80) base.push(R); }
    if (!base.length || base[0] < 60) base.unshift(Math.max(60, RV * .3));
    base.push(FAR);
    const NR = base.length;
    const Rk = base.map((R, j) => Array.from({ length: nRay }, (_, k) => j === NR - 1 ? FAR : R * (1 + U(-S.noise, S.noise))));
    for (let k = 0; k < nRay; k++) { Rk[0][k] = Math.max(Rk[0][k], origR[k] + 30); for (let j = 1; j < NR; j++) Rk[j][k] = Math.max(Rk[j][k], Rk[j - 1][k] + 30); }

    // edges (pre-stretch); ray segments are drawn outward, arcs from the end that cracked first
    const rayE = [], arcE = [];
    for (let k = 0; k < nRay; k++) {
      const bounds = [origR[k], ...Rk.map(row => row[k])]; const segs = [];
      for (let j = 0; j < bounds.length - 1; j++) {
        const pts = raySeg(k, bounds[j], bounds[j + 1]);
        const e = mkEdge(pts, bounds[j], 0);
        // visible portion: points within this ray's visible radius
        let L = 0; for (let i = 1; i < pts.length; i++) { const rr = Math.hypot(pts[i][0] - HX, pts[i][1] - HY);
          if (rr <= rayVis[k]) L = e.cum[i]; else { const r0 = Math.hypot(pts[i - 1][0] - HX, pts[i - 1][1] - HY); L = e.cum[i - 1] + (e.cum[i] - e.cum[i - 1]) * clamp((rayVis[k] - r0) / (rr - r0)); break; } }
        e.vis1 = bounds[j] < rayVis[k] ? L : 0; e.canon = pts; e.w = hidden[k] ? 4 : 6.5 - 2.5 * clamp(bounds[j] / 1100); segs.push(e);
      }
      rayE.push(segs);
    }
    for (let k = 0; k < nRay; k++) {
      const row = [];
      for (let j = 0; j < NR - 1; j++) {
        const R0 = Rk[j][k], R1 = Rk[j][(k + 1) % nRay], [p0] = rayPoint(k, R0), [p1] = rayPoint(k + 1, R1);
        const a0 = Math.atan2(p0[1] - HY, p0[0] - HX); let a1 = Math.atan2(p1[1] - HY, p1[0] - HX);
        while (a1 <= a0) a1 += 2 * Math.PI;
        // web segment: usually a straight chord with a slight kink, sometimes a gentle curve (never a circle)
        const canon = [p0];
        if (r() < .7) { const mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2, L = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]), k = U(-.035, .035) * L;
          canon.push([mx + k * (p0[1] - p1[1]) / (L || 1), my + k * (p1[0] - p0[0]) / (L || 1)]); }
        else { const bulge = U(-.06, .06);
          for (let q = 1; q < 6; q++) { const u = q / 6, a = a0 + (a1 - a0) * u, rr = (R0 + (R1 - R0) * u) * (1 + bulge * Math.sin(Math.PI * u));
            canon.push([HX + rr * Math.cos(a), HY + rr * Math.sin(a)]); } }
        canon.push(p1);
        const e = mkEdge(R1 < R0 ? canon.slice().reverse() : canon, Math.min(R0, R1), 0); e.canon = canon; e.w = 4; row.push(e);
      }
      arcE.push(row);
    }
    // ring visibility per gap between two VISIBLE cracks: the ring crosses the whole gap (through hidden rays),
    // grows partway from one side, or is absent
    const visIdx = []; for (let k = 0; k < nRay; k++) if (!hidden[k]) visIdx.push(k);
    for (let q = 0; q < visIdx.length; q++) {
      const ka = visIdx[q], kb = visIdx[(q + 1) % visIdx.length];
      const span = []; for (let k = ka; k !== kb; k = (k + 1) % nRay) span.push(k);
      if (!span.length) continue;
      for (let j = 0; j < Math.min(nVis, NR - 1); j++) {
        const va = rayVis[ka] >= Rk[j][ka], vb = rayVis[kb] >= Rk[j][kb];
        if (!(va || vb) || r() >= S.arcP) continue;
        const both = va && vb && r() < .7, fromA = va && (!vb || r() < .5);
        const chain = fromA ? span : span.slice().reverse();
        let total = 0; const lens = chain.map(k => polyLen(arcE[k][j].canon).slice(-1)[0]); lens.forEach(l => total += l);
        let budget = both ? total : total * U(.3, .85), d = fromA ? Rk[j][ka] : Rk[j][kb];
        for (let c = 0; c < chain.length && budget > 0; c++) {
          const k = chain[c], canon = arcE[k][j].canon, pts = fromA ? canon : canon.slice().reverse();
          const e = mkEdge(pts, d, Math.min(budget, lens[c])); e.canon = canon; e.w = 4; arcE[k][j] = e;
          budget -= lens[c]; d += lens[c];
        }
      }
    }

    // branches, crush around the centre, optional secondary stars
    const branches = [];
    const walk = (x, y, a, len, seg, turn) => { const pts = [[x, y]]; let d = 0; while (d < len) { const st = U(...seg); a += U(-turn, turn); x += st * Math.cos(a); y += st * Math.sin(a); d += st; pts.push([x, y]); } return pts; };
    for (let k = 0; k < nRay; k++) {
      if (rayVis[k] < 70) continue;
      for (let b = RI(...S.br); b > 0; b--) {
        const at = rayVis[k] * U(.2, .85), [st] = rayPoint(k, at);
        const ba = Math.atan2(st[1] - HY, st[0] - HX) + (r() < .5 ? -1 : 1) * U(.35, .8);
        branches.push({ pts: walk(st[0], st[1], ba, U(50, 150), [18, 32], .12), d0: at });
      }
    }
    for (let c = RI(2, 4); c > 0; c--) { const a = U(0, 2 * Math.PI), rr = U(4, 12);
      branches.push({ pts: walk(HX + rr * Math.cos(a), HY + rr * Math.sin(a), a + U(-.5, .5), U(18, 40), [8, 14], .2), d0: rr }); }

    // random stretch axis (applied to everything about the hit point)
    const phi = U(0, Math.PI), sx = U(1, 1.25), sy = 1 / Math.sqrt(sx);
    const cph = Math.cos(phi), sph = Math.sin(phi);
    const T = ([x, y]) => { const dx = x - HX, dy = y - HY, u = dx * cph + dy * sph, v = -dx * sph + dy * cph, u2 = u * sx, v2 = v * sy;
      return [HX + u2 * cph - v2 * sph, HY + u2 * sph + v2 * cph]; };
    const stretchEdge = e => { const pre = e.len, preStart = Math.hypot(e.pts[0][0] - HX, e.pts[0][1] - HY);
      e.pts = e.pts.map(T); e.canon = e.canon ? e.canon.map(T) : e.pts; e.cum = polyLen(e.pts); e.len = e.cum[e.cum.length - 1];
      const ratio = pre > 0 ? e.len / pre : 1; e.vis1 = Math.min(e.len, e.vis1 * ratio);

    // pieces = cells between rays and rings

      for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); } return [x0, y0, x1, y1]; };
    const brBoxes = brE.map(e => bbox(e.pts));
    const M = 160, pieces = [];
    for (let k = 0; k < nRay; k++) {
      const k1 = (k + 1) % nRay;
      for (let j = 0; j < NR; j++) {
        const A = rayE[k][j], B = rayE[k1][j], top = arcE[k][j], bot = j > 0 ? arcE[k][j - 1] : null;
        if (!top && j < NR - 1) continue;
        const poly = j === NR - 1 ? null : [...A.canon, ...top.canon.slice(1, -1), ...B.canon.slice().reverse(), ...(bot ? bot.canon.slice().reverse().slice(1, -1) : [])];
        if (!poly) continue;
        const cp = clipRect(poly, -M, -M, W + M, H + M);
        if (cp.length < 3) continue;
        const [bx0, by0, bx1, by1] = bbox(cp);
        if (bx1 < 0 || by1 < 0 || bx0 > W || by0 > H) continue;
        const path = new Path2D(); path.moveTo(cp[0][0], cp[0][1]); for (let i = 1; i < cp.length; i++) path.lineTo(cp[i][0], cp[i][1]); path.closePath();
        const inner = clipRect(cp, 0, 0, W, H); const [cx, cy] = centroid(inner.length >= 3 ? inner : cp);
        const edges = [A, B, top]; if (bot) edges.push(bot);
        const brs = brE.filter((_, i) => { const q = brBoxes[i]; return !(q[2] < bx0 || q[0] > bx1 || q[3] < by0 || q[1] > by1); });
        const d = Math.hypot(cx - HX, cy - HY), an = Math.atan2(cy - HY, cx - HX);
        // the piece bursts into shards when it breaks: finer near the hit, big outer slabs split too
        const near = clipRect(cp, -40, -40, W + 40, H + 40), shardPolys = [];
        if (near.length >= 3) {
          const target = d < RV ? U(4500, 8000) : 16000 + d * 14;
          let parts = [near], cuts = clamp(Math.ceil(areaOf(near) / target) - 1, 0, 3);
          while (cuts-- > 0) {
            parts.sort((x, y) => areaOf(y) - areaOf(x));
            const big = parts[0], [gx, gy] = centroid(big), th = U(0, Math.PI), nx = Math.cos(th), ny = Math.sin(th);
            const off = U(-.25, .25) * Math.sqrt(areaOf(big)), c = nx * gx + ny * gy + off;
            const A1 = clipHalf(big, nx, ny, c), A2 = clipHalf(big, -nx, -ny, -c);
            if (A1.length < 3 || A2.length < 3 || areaOf(A1) < 250 || areaOf(A2) < 250) continue;
            parts[0] = A1; parts.push(A2);
          }
          for (const sp of parts) {
            const [sx0, sy0, sx1, sy1] = bbox(sp), [scx, scy] = centroid(sp), sd = Math.hypot(scx - HX, scy - HY), sa = Math.atan2(scy - HY, scx - HX);
            const sPath = new Path2D(); sPath.moveTo(sp[0][0], sp[0][1]); for (let i = 1; i < sp.length; i++) sPath.lineTo(sp[i][0], sp[i][1]); sPath.closePath();
            const blast = 520 * Math.exp(-sd / 260), spd = U(40, 150) + blast * U(.6, 1.1);
            shardPolys.push({ path: sPath, bx: Math.floor(sx0) - 6, by: Math.floor(sy0) - 6, bw: Math.ceil(sx1 - sx0) + 12, bh: Math.ceil(sy1 - sy0) + 12,
              cx: scx, cy: scy, vx: Math.cos(sa) * spd + U(-60, 60), vy: Math.sin(sa) * spd - U(30, 140), om: U(-2.4, 2.4) * (1 + blast / 700),
              flip: U(2, 7) * (r() < .5 ? -1 : 1), fph: U(0, Math.PI), grow: .45 * Math.exp(-sd / 320), jit: U(0, .02), sprite: null });
          }
        }
        pieces.push({ path, edges, branches: brs, shards: shardPolys, bx: Math.floor(bx0) - 6, by: Math.floor(by0) - 6, bw: Math.ceil(bx1 - bx0) + 12, bh: Math.ceil(by1 - by0) + 12, cx, cy, d,
          delay: RUN * .85 * (1 - Math.sqrt(1 - clamp(d / FAR))) + U(0, .035),
          vx: Math.cos(an) * U(90, 260), vy0: Math.sin(an) * U(40, 160) - U(60, 160), om: U(-2.2, 2.2), sprite: null });
      }
    }
    const spray = []; for (let i = 0; i < 55; i++) { const a = U(0, 2 * Math.PI), v = U(350, 1100);
      spray.push({ vx: Math.cos(a) * v, vy: Math.sin(a) * v - U(0, 250), s: U(2, 6), rot: U(0, 6.3), om: U(-12, 12), life: U(.3, .55), a: U(.45, .85) }); }
    const allE = [...rayE.flat(), ...arcE.flat(), ...brE];
    const fmax = Math.max(...allE.filter(e => e.vis1 > 0).map(e => e.d0 + e.vis1), 1);
    return { seed, style, HX, HY, RV, nRay: nVisRay, pieces, fmax, spray };
  }

  // ---------- drawing ----------
  const LIGHT = '255,255,255', LIGHT_A = 1, DARK = '10,14,22', DARK_A = .32, HALO = 5;   // bold white, faint halo for bright backgrounds
  function pointAt(e, s) {
    if (s <= 0) return e.pts[0]; if (s >= e.len) return e.pts[e.pts.length - 1];
    let i = 1; while (e.cum[i] < s) i++;
    const u = (s - e.cum[i - 1]) / (e.cum[i] - e.cum[i - 1] || 1), a = e.pts[i - 1], b = e.pts[i];
    return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
  }
  function pathRange(c, e, s0, s1) {
    const p0 = pointAt(e, s0); c.beginPath(); c.moveTo(p0[0], p0[1]);
    for (let i = 1; i < e.pts.length; i++) if (e.cum[i] > s0 && e.cum[i] < s1) c.lineTo(e.pts[i][0], e.pts[i][1]);
    const p1 = pointAt(e, s1); c.lineTo(p1[0], p1[1]);
  }
  // stroke the first L px of an edge, with a tapered tip where it is still growing
  function strokePartial(c, e, L, w, rgb, a) {
    if (L <= .5) return;
    const tip = L < e.len - .5 ? Math.min(40, L * .5) : 0, main = L - tip;
    c.lineWidth = w; c.strokeStyle = `rgba(${rgb},${a})`;
    if (main > .5) { pathRange(c, e, 0, main); c.stroke(); }
    for (let q = 0; q < 3 && tip > 0; q++) {
      const f = (q + .5) / 3; c.lineWidth = w * (1 - .4 * f); c.strokeStyle = `rgba(${rgb},${a * (1 - f)})`;
      pathRange(c, e, main + tip * q / 3, main + tip * (q + 1) / 3); c.stroke();
    }
  }
  // One piece, clipped to itself: shared edges show half their width from each side, so the glass in place and
  // the falling pieces look identical. vis(e) = how many px of each edge are cracked right now.
  function drawPiece(c, pc, vis, frost) {
    c.save(); c.clip(pc.path); c.lineJoin = 'round'; c.lineCap = 'round';
    if (frost) { c.fillStyle = 'rgba(255,255,255,.05)'; c.fill(pc.path); }
    for (const [rgb, a, extra] of [[DARK, DARK_A, HALO], [LIGHT, LIGHT_A, 0]]) {
      for (const e of pc.edges) strokePartial(c, e, vis(e), e.w + extra, rgb, a);
      for (const e of pc.branches) strokePartial(c, e, vis(e), e.w + extra, rgb, a);
    }
    c.restore();
  }
  function makeSprite(pc) {
    const s = document.createElement('canvas'); s.width = pc.bw; s.height = pc.bh;
    const c = s.getContext('2d'); c.setTransform(1, 0, 0, 1, -pc.bx, -pc.by);
    drawPiece(c, pc, e => e.len, true); return s;
  }

  function makeShardSprite(pc, sh) {
    const s = document.createElement('canvas'); s.width = sh.bw; s.height = sh.bh;
    const c = s.getContext('2d'); c.setTransform(1, 0, 0, 1, -sh.bx, -sh.by);
    c.save(); c.clip(sh.path); c.lineJoin = 'round'; c.lineCap = 'round';
    c.fillStyle = 'rgba(255,255,255,.07)'; c.fill(sh.path);
    // shard edges are stroked on the clipped outline, so only the inner half shows: 11 px -> ~5.5 px of white
    for (const [rgb, a, we, extra] of [[DARK, DARK_A, 11 + 2 * HALO, HALO], [LIGHT, LIGHT_A, 11, 0]]) {
      c.lineWidth = we; c.strokeStyle = `rgba(${rgb},${a})`; c.stroke(sh.path);
      for (const e of pc.branches) strokePartial(c, e, e.len, e.w + extra, rgb, a);
    }
    c.restore(); return s;
  }

  // ---------- stages ----------
  const ST1 = 0.6, ST2 = 1.9;
  const vis1At = (g, t) => { const F = g.fmax * easeOut(t / .25, 2.2); return e => clamp(F - e.d0, 0, e.vis1); };
  function renderStage1(g, t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
    const amp = 38 * Math.exp(-t * 7) * (1 - smooth((t - .3) / .2));
    const dx = Math.round(amp * Math.sin(2 * Math.PI * 19 * t)), dy = Math.round(amp * .8 * Math.cos(2 * Math.PI * 27 * t + 1));
    ctx.setTransform(1, 0, 0, 1, dx, dy);
    const vis = vis1At(g, t);
    for (const pc of g.pieces) drawPiece(ctx, pc, vis, false);
    const fa = t < .3 ? .45 * Math.exp(-t * 22) : 0;
    if (fa > .003) {
      const fg = ctx.createRadialGradient(g.HX, g.HY, 0, g.HX, g.HY, 520);
      fg.addColorStop(0, `rgba(255,255,255,${fa})`); fg.addColorStop(.35, `rgba(235,242,255,${fa * .45})`); fg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = fg; ctx.fillRect(g.HX - 520, g.HY - 520, 1040, 1040);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  function renderStage2(g, t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
    const F2 = FAR * easeOut(t / RUN, 2);                                  // the second crack sweeps the screen
    const vis = e => Math.max(e.vis1, clamp(F2 - e.d0, 0, e.len));
    const amp = 52 * Math.exp(-t * 9) * (1 - smooth((t - .3) / .2));      // sharp, short jolt
    const sx = Math.round(amp * Math.sin(2 * Math.PI * 23 * t + .5)), sy = Math.round(amp * .8 * Math.cos(2 * Math.PI * 29 * t));
    ctx.setTransform(1, 0, 0, 1, sx, sy);
    const falling = [];
    for (const pc of g.pieces) {
      const tt = t - pc.delay;
      if (tt < 0) { drawPiece(ctx, pc, vis, false); continue; }
      for (const sh of pc.shards) falling.push([pc, sh, tt - sh.jit]);
    }
    const G = 3000;
    for (const [pc, sh, tt] of falling) {
      if (tt < 0) continue;
      if (!sh.sprite) sh.sprite = makeShardSprite(pc, sh);
      const drag = (1 - Math.exp(-tt * 3)) / 3;                          // the blast slows a little in the air
      const dx = sh.vx * drag, dy = sh.vy * drag + .5 * G * tt * tt;
      if (sh.by + dy > H + 250 && dy > 0) continue;
      const grow = 1 + sh.grow * easeOut(tt / .5, 2);                        // near shards fly toward the camera
      const fx = Math.cos(sh.fph + sh.flip * tt), flip = Math.sign(fx || 1) * Math.max(.12, Math.abs(fx));   // tumbling edge-on
      ctx.setTransform(1, 0, 0, 1, sx, sy);
      ctx.translate(sh.cx + dx, sh.cy + dy); ctx.rotate(sh.om * tt); ctx.scale(grow * flip, grow); ctx.translate(-sh.cx, -sh.cy);
      ctx.globalAlpha = (.75 + .25 * Math.abs(fx)) * (1 - smooth((tt - 1.1) / .4));
      ctx.drawImage(sh.sprite, sh.bx, sh.by);
    }
    ctx.globalAlpha = 1;
    // glass spray from the hit
    ctx.setTransform(1, 0, 0, 1, sx, sy);
    for (const p of g.spray) {
      if (t > p.life) continue;
      const u = t / p.life, dr = (1 - Math.exp(-t * 4)) / 4, x = g.HX + p.vx * dr, y = g.HY + p.vy * dr + .5 * G * t * t, r0 = p.s * (1 - .4 * u), ro = p.rot + p.om * t;
      ctx.fillStyle = `rgba(235,242,255,${p.a * (1 - u)})`; ctx.beginPath();
      ctx.moveTo(x + r0 * Math.cos(ro), y + r0 * Math.sin(ro)); ctx.lineTo(x + r0 * .6 * Math.cos(ro + 2.3), y + r0 * .6 * Math.sin(ro + 2.3)); ctx.lineTo(x + r0 * .8 * Math.cos(ro + 4.1), y + r0 * .8 * Math.sin(ro + 4.1));
      ctx.closePath(); ctx.fill();
    }
    // second-impact flash
    const fa = .38 * Math.exp(-t * 26);
    if (fa > .003) {
      const fg = ctx.createRadialGradient(g.HX, g.HY, 0, g.HX, g.HY, 650);
      fg.addColorStop(0, `rgba(255,255,255,${fa})`); fg.addColorStop(.3, `rgba(230,240,255,${fa * .4})`); fg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = fg; ctx.fillRect(g.HX - 650, g.HY - 650, 1300, 1300);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  // ---------- state machine ----------
  let geom = null, phase = 'idle', t0 = 0, raf = 0, holdTimer = 0;
  let count = 0; const seedEl = document.getElementById('seed');
  const emit = p => {
    if (p === 'crack') { count++; if (seedEl) seedEl.textContent = `crack #${count} · seed ${geom.seed} · ${geom.style} · ${geom.nRay} rays`; }
    dispatchEvent(new CustomEvent('screencrack', { detail: { phase: p, seed: geom && geom.seed } }));
  };
  function tick() {
    const t = Math.max(0, (performance.now() - t0) / 1000);   // one clock for start and frames
    if (phase === 'crack') {
      if (t >= ST1) { renderStage1(geom, ST1); phase = 'hold'; emit('hold'); raf = 0; return; }
      renderStage1(geom, t);
    } else if (phase === 'shatter') {
      if (t >= ST2) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H); phase = 'idle'; geom = null; emit('done'); raf = 0; return; }
      renderStage2(geom, t);
    } else { raf = 0; return; }
    raf = requestAnimationFrame(tick);
  }
  function start(p) { phase = p; t0 = performance.now(); emit(p); if (!raf) raf = requestAnimationFrame(tick); }
  const API = {
    crack({ x = CFG.x, y = CFG.y, seed } = {}) {
      clearTimeout(holdTimer);
      const s = seed ?? (P.has('seed') ? num('seed', 1) : (Math.random() * 2 ** 32) >>> 0);
      geom = generate(s, x, y); start('crack'); return s;
    },
    shatter() { if (!geom) return; clearTimeout(holdTimer); for (const pc of geom.pieces) for (const sh of pc.shards) sh.sprite = null; start('shatter'); },
    play({ hold = CFG.hold, ...o } = {}) {
      const s = API.crack(o);
      holdTimer = setTimeout(() => API.shatter(), ST1 * 1000 + hold); return s;
    },
    reset() { clearTimeout(holdTimer); cancelAnimationFrame(raf); raf = 0; phase = 'idle'; geom = null;
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H); },
    get phase() { return phase; },
    _render(stage, t, seed, x = CFG.x, y = CFG.y) {           // deterministic single frame, for tests
      const g = generate(seed, x, y);
      if (stage === 2) { renderStage2(g, t); } else renderStage1(g, stage === 'hold' ? ST1 : t);
      document.title = 'ready ' + g.style;
      return g;
    },
  };
  window.ScreenCrack = API;

  if (PREVIEW) addEventListener('keydown', e => {
    if (e.code === 'Space' || e.key === 'n' || e.key === 'N') { e.preventDefault(); API.play(); }
    else if (e.key === 'c' || e.key === 'C') API.crack();
    else if (e.key === 's' || e.key === 'S') API.shatter();
    else if (e.key === 'r' || e.key === 'R') API.reset();
  });
  if (PREVIEW) cvs.addEventListener('click', e => {
    const b = cvs.getBoundingClientRect();
    API.crack({ x: (e.clientX - b.left) / b.width * W, y: (e.clientY - b.top) / b.height * H });
  });

  if (P.has('freeze')) {
    const f = P.get('freeze'), seed = num('seed', 1);
    if (f === 'hold') API._render('hold', 0, seed);
    else { const [s, t] = f.split(':'); API._render(+s, +t, seed); }
    document.title = 'ready';
  } else if (DEMO) {
    const loop = () => { API.play(); setTimeout(loop, ST1 * 1000 + CFG.hold + ST2 * 1000 + 700); };
    setTimeout(loop, 400);
  } else if (!PREVIEW || P.get('once') !== '0') {
    API.play();                                   // one pass on load: crack → hold → shatter → empty
  }
})();
</script>
</body>
